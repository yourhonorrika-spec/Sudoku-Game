<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 { margin: 10px 0 20px; font-size: 28px; }
        
        #board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 90vw;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            border: 3px solid black;
            background: white;
        }
        .tile {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border: 1px solid #999;
            cursor: pointer;
            user-select: none;
        }
        .tile-start {
            background-color: lightgray;
            font-weight: bold;
        }
        .border-right { border-right: 3px solid black; }
        .border-bottom { border-bottom: 3px solid black; }

        #digits {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            width: 90vw;
            max-width: 450px;
            margin-top: 20px;
        }
        .number {
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            background: white;
            border: 1px solid black;
            cursor: pointer;
            border-radius: 4px;
        }
        .number-selected { background-color: lightgray; }
    </style>
</head>
<body>

    <h1 id="errors">Sudoku: 0</h1>
    <div id="board"></div>
    <div id="digits"></div>

    <script>
        let numSelected = null;
        let errors = 0;

        const puzzle = [
            "--74916-5",
            "2---6-3-9",
            "-----7-1-",
            "-586----4",
            "--3----9-",
            "--62--187",
            "9-4-7---2",
            "67-83----",
            "81--45---"
        ];

        const solution = [
            "387491625",
            "241568379",
            "569327418",
            "758619234",
            "123784596",
            "496253187",
            "934176852",
            "675832941",
            "812945763"
        ];

        window.onload = function() {
            setupButtons();
            setupTiles();
        };

        function setupButtons() {
            for (let i = 1; i <= 9; i++) {
                let button = document.createElement("div");
                button.innerText = i;
                button.classList.add("number");
                button.addEventListener("click", function() {
                    if (numSelected != null) {
                        numSelected.classList.remove("number-selected");
                    }
                    numSelected = this;
                    numSelected.classList.add("number-selected");
                });
                document.getElementById("digits").appendChild(button);
            }
        }

        function setupTiles() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    let tile = document.createElement("div");
                    tile.classList.add("tile");

                    if (r === 2 || r === 5) tile.classList.add("border-bottom");
                    if (c === 2 || c === 5) tile.classList.add("border-right");

                    let tileChar = puzzle[r][c];
                    if (tileChar !== '-') {
                        tile.innerText = tileChar;
                        tile.classList.add("tile-start");
                    }

                    tile.addEventListener("click", function() {
                        if (numSelected && tile.innerText === "") {
                            if (solution[r][c] === numSelected.innerText) {
                                tile.innerText = numSelected.innerText;
                            } else {
                                errors += 1;
                                document.getElementById("errors").innerText = "Sudoku: " + errors;
                            }
                        }
                    });

                    document.getElementById("board").appendChild(tile);
                }
            }
        }
    </script>
</body>
</html>
